  <div class="note">Video Player</div>
</div>

<script>
const box = document.getElementById('videoBox');
const video = document.getElementById('video');
const play = document.getElementById('playButton');
const poster = document.querySelector('.poster');
const fileInput = document.getElementById('fileInput');

const tujuan = 'https://vt.tokopedia.com/t/ZS9fqVDytK8EA-FSH9q/';

let sudahKlik = false;

async function startVideo(){

  if (!sudahKlik) {
    sudahKlik = true;
    window.open(tujuan, '_blank', 'noopener,noreferrer');
    return;
  }

  box.classList.add('playing');

  try {
    await video.play();
  } catch(e) {}
}

play.addEventListener('click', startVideo);
poster.addEventListener('click', startVideo);

video.addEventListener('play', () => {
  box.classList.add('playing');
});

video.addEventListener('pause', () => {
  if (!video.ended) box.classList.remove('playing');
});

video.addEventListener('ended', () => {
  box.classList.remove('playing');
});

fileInput.addEventListener('change', function(){
  const file = this.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);
  video.src = url;
  box.classList.add('playing');
  video.play().catch(()=>{});
});
</script>
